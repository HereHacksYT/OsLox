<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OsLox</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

  <!-- ===== MOBİL YATAY UYARI (SADECE OYUN AÇIKKEN) ===== -->
  <div id="rotate-warning" style="display:none;">
    <div class="warning-content">
      <span class="icon">📱</span>
      <h2>Lütfen telefonu yatay çevir!</h2>
      <p>Oyunu yatay modda oynayabilirsiniz.</p>
    </div>
  </div>

  <!-- ===== GİRİŞ EKRANI ===== -->
  <div id="login-screen">
    <h1>OsLox</h1>
    <input type="text" id="login-username" placeholder="Kullanıanelcı adınız">
    <button id="login-btn">Giriş Yap</button>
    <div id="login-error"></div>
 " </div>

  <!-- ===== ANA PANEL ===== -->
  <div id="main-p style="display:none;">
    <div id="top-bar">
      <div class="user-info">
        <img id="profile-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=default">
        <span id="profile-username">İsim</span>
      </div>
      <div class="actions">
        <button class="btn-costume" id="character-btn">👤 Karakter</button>
        <button class="btn-logout" id="logout-btn">🚪 Çıkış</button>
      </div>
    </div>
    <div id="content">
      <div class="section">
        <h3>🎮 Oyunlar</h3>
        <div id="game-list"></div>
      </div>
      <div class="section">
        <h3>👥 Arkadaşlarım</h3>
        <ul class="friend-list" id="friends-list"></ul>
        <div style="margin-top:10px;">
          <input type="text" id="friend-input" placeholder="Arkadaşının adı" style="padding:8px;border-radius:6px;border:none;width:70%;">
          <button id="add-friend-btn" style="padding:8px 12px;background:#e94560;color:white;border:none;border-radius:6px;">➕</button>
        </div>
        <div id="friend-requests" style="margin-top:10px;"></div>
      </div>
    </div>
  </div>

  <!-- ===== OYUN EKRANI ===== -->
  <div id="game-screen" style="display:none;">
    <div id="game-ui">
      <button id="exit-game-btn">✕ Çık</button>
      <button id="chat-toggle-btn">💬 Sohbet</button>
    </div>
    <div id="chat-panel" style="display:none;">
      <div id="chat-messages"></div>
      <div id="chat-input-area">
        <input type="text" id="chat-input" placeholder="Mesaj yaz...">
        <button id="chat-send-btn">Gönder</button>
      </div>
    </div>
    <div id="game-container"></div>
    <!-- Yükleme (basit) -->
    <div id="loading-overlay">
      <p>🎮 Oyun yükleniyor...</p>
      <div class="loading-bar"><div id="loading-progress" style="width:0%;"></div></div>
    </div>
    <!-- JOYSTICK -->
    <div id="joystick-container">
      <div id="joystick-knob"></div>
    </div>
  </div>

  <!-- ===== KARAKTER SEÇİM MODALI ===== -->
  <div class="modal" id="character-modal">
    <div class="modal-content">
      <h3>👤 Karakter Seç</h3>
      <p style="color:#aaa;font-size:0.9rem;">Tek bir karakter (model.glb) kullanılıyor</p>
      <div class="character-options" id="character-options">
        <div class="char-card selected" data-id="default">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=default" alt="Karakter">
          <div class="char-name">Varsayılan</div>
        </div>
      </div>
      <button class="btn-close-modal" id="close-modal-btn">Kapat</button>
    </div>
  </div>

  <script src="/js/avatar.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
